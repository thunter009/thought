name: Type Check

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

env:
    ACTIONS_RUNNER_DEBUG: ${{ vars.ACTIONS_RUNNER_DEBUG }}
    ACTIONS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}

jobs:
    typecheck:
        name: Type Check
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: ["ubuntu-latest"]
                python-version: ["3.11"]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cancel Previous Runs
              uses: styfle/cancel-workflow-action@0.12.1
              with:
                  access_token: ${{ github.token }}

            - name: Cache system dependencies
              uses: actions/cache@v4
              id: system-deps-cache
              env:
                  cache-name: system-deps
              with:
                  path: |
                      /var/cache/apt/archives/*.deb
                      ~/.local/lib
                      ~/.local/include
                  key: ${{ runner.os }}-${{ env.cache-name }}-v1
                  restore-keys: |
                      ${{ runner.os }}-${{ env.cache-name }}-
                      ${{ runner.os }}-

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Setup uv
              id: uv-version
              run: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  UV_VERSION=$(/home/runner/.local/bin/uv --version | cut -d' ' -f2)
                  echo "version=$UV_VERSION" >> $GITHUB_OUTPUT
                  echo "uv-version=$UV_VERSION"
                  echo "/home/runner/.local/bin" >> $GITHUB_PATH

            - name: Restore Python environment cache
              id: cache-restore
              uses: actions/cache/restore@v4
              with:
                  path: |
                      .venv
                      ~/.cache/uv
                      ~/.local/share/uv
                  key: ${{ runner.os }}-python-env-3.11-uv-${{ steps.uv-version.outputs.version }}-mypy-${{ hashFiles('pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-python-env-3.11-uv-${{ steps.uv-version.outputs.version }}-mypy-
                      ${{ runner.os }}-python-env-3.11-

            - name: Setup Python environment
              id: setup-env
              run: |
                  set -eo pipefail
                  if [ "${{ steps.cache-restore.outputs.cache-hit }}" != 'true' ]; then
                    echo "Creating new virtual environment"
                    uv venv --seed --python 3.11
                  fi
                  source .venv/bin/activate
                  uv sync --extra dev && uv pip install -e .

            - name: Save Python environment cache
              if: always() && steps.cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: |
                      .venv
                      ~/.cache/uv
                      ~/.local/share/uv
                  key: ${{ steps.cache-restore.outputs.cache-primary-key }}

            - name: Run mypy
              run: |
                  source .venv/bin/activate
                  mypy .
