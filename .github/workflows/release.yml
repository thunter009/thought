name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current version
      id: get_version
      run: |
        # Get the latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"
        echo "current_version=$LATEST_TAG" >> $GITHUB_OUTPUT

        # Extract version components
        VERSION=${LATEST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        echo "major=$MAJOR" >> $GITHUB_OUTPUT
        echo "minor=$MINOR" >> $GITHUB_OUTPUT
        echo "patch=$PATCH" >> $GITHUB_OUTPUT

    - name: Determine version bump
      id: version_bump
      run: |
        # Check commit messages for version bump indicators
        COMMITS=$(git log ${{ steps.get_version.outputs.current_version }}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

        MAJOR_BUMP=false
        MINOR_BUMP=false

        # Check for breaking changes (major bump)
        if echo "$COMMITS" | grep -qE "^(feat|fix|chore|docs|style|refactor|perf|test)(\(.+\))?!:|BREAKING CHANGE:"; then
          MAJOR_BUMP=true
        fi

        # Check for features (minor bump)
        if echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
          MINOR_BUMP=true
        fi

        # Calculate new version
        MAJOR=${{ steps.get_version.outputs.major }}
        MINOR=${{ steps.get_version.outputs.minor }}
        PATCH=${{ steps.get_version.outputs.patch }}

        if [ "$MAJOR_BUMP" = "true" ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
          BUMP_TYPE="major"
        elif [ "$MINOR_BUMP" = "true" ]; then
          MINOR=$((MINOR + 1))
          PATCH=0
          BUMP_TYPE="minor"
        else
          PATCH=$((PATCH + 1))
          BUMP_TYPE="patch"
        fi

        NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
        echo "New version: $NEW_VERSION (${BUMP_TYPE} bump)"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "new_version_bare=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
        echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

    - name: Update version in pyproject.toml
      run: |
        sed -i 's/version = "[0-9]*\.[0-9]*\.[0-9]*"/version = "${{ steps.version_bump.outputs.new_version_bare }}"/' pyproject.toml

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit version bump
      run: |
        git add pyproject.toml
        git commit -m "chore: bump version to ${{ steps.version_bump.outputs.new_version }}" || echo "No changes to commit"

    - name: Create and push tag
      run: |
        git tag -a "${{ steps.version_bump.outputs.new_version }}" -m "Release ${{ steps.version_bump.outputs.new_version }}"
        git push origin HEAD:main
        git push origin "${{ steps.version_bump.outputs.new_version }}"

    - name: Generate release notes
      id: release_notes
      run: |
        # Generate release notes from commits
        PREVIOUS_TAG="${{ steps.get_version.outputs.current_version }}"
        NEW_TAG="${{ steps.version_bump.outputs.new_version }}"

        echo "## What's Changed" > release_notes.md
        echo "" >> release_notes.md

        # Group commits by type
        git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s|%h" | while IFS='|' read -r msg hash; do
          if [[ $msg =~ ^feat ]]; then
            echo "- ✨ $msg ($hash)" >> release_notes.md
          elif [[ $msg =~ ^fix ]]; then
            echo "- 🐛 $msg ($hash)" >> release_notes.md
          elif [[ $msg =~ ^docs ]]; then
            echo "- 📚 $msg ($hash)" >> release_notes.md
          elif [[ $msg =~ ^chore ]]; then
            echo "- 🔧 $msg ($hash)" >> release_notes.md
          else
            echo "- $msg ($hash)" >> release_notes.md
          fi
        done || echo "- Initial release" >> release_notes.md

        echo "" >> release_notes.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${NEW_TAG}" >> release_notes.md

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version_bump.outputs.new_version }}
        release_name: Release ${{ steps.version_bump.outputs.new_version }}
        body_path: release_notes.md
        draft: false
        prerelease: false