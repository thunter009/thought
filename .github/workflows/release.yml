name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current version
      id: get_version
      run: |
        # Get the latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"
        echo "current_version=$LATEST_TAG" >> $GITHUB_OUTPUT

        # Extract version components
        VERSION=${LATEST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        echo "major=$MAJOR" >> $GITHUB_OUTPUT
        echo "minor=$MINOR" >> $GITHUB_OUTPUT
        echo "patch=$PATCH" >> $GITHUB_OUTPUT

    - name: Check if version was updated in PR
      id: check_version
      run: |
        # Read version from pyproject.toml
        PYPROJECT_VERSION=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        echo "Version in pyproject.toml: $PYPROJECT_VERSION"

        # Compare with latest tag (without 'v' prefix)
        LATEST_VERSION="${{ steps.get_version.outputs.current_version }}"
        LATEST_VERSION=${LATEST_VERSION#v}

        if [ "$PYPROJECT_VERSION" != "$LATEST_VERSION" ]; then
          echo "Version was updated from $LATEST_VERSION to $PYPROJECT_VERSION"
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "new_version=v$PYPROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version_bare=$PYPROJECT_VERSION" >> $GITHUB_OUTPUT

          # Determine bump type
          IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$PYPROJECT_VERSION"
          OLD_MAJOR=${{ steps.get_version.outputs.major }}
          OLD_MINOR=${{ steps.get_version.outputs.minor }}
          OLD_PATCH=${{ steps.get_version.outputs.patch }}

          if [ "$NEW_MAJOR" -gt "$OLD_MAJOR" ]; then
            echo "bump_type=major" >> $GITHUB_OUTPUT
          elif [ "$NEW_MINOR" -gt "$OLD_MINOR" ]; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
          else
            echo "bump_type=patch" >> $GITHUB_OUTPUT
          fi
        else
          echo "Version unchanged"
          echo "version_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      if: steps.check_version.outputs.version_changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Create annotated tag on the current commit
        git tag -a "${{ steps.check_version.outputs.new_version }}" -m "Release ${{ steps.check_version.outputs.new_version }}"
        git push origin "${{ steps.check_version.outputs.new_version }}"

    - name: Generate release notes
      if: steps.check_version.outputs.version_changed == 'true'
      id: release_notes
      run: |
        # Generate release notes from commits
        PREVIOUS_TAG="${{ steps.get_version.outputs.current_version }}"
        NEW_TAG="${{ steps.check_version.outputs.new_version }}"

        echo "## What's Changed" > release_notes.md
        echo "" >> release_notes.md

        # Group commits by type
        git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s|%h" | while IFS='|' read -r msg hash; do
          if [[ $msg =~ ^feat ]]; then
            echo "- ✨ $msg ($hash)" >> release_notes.md
          elif [[ $msg =~ ^fix ]]; then
            echo "- 🐛 $msg ($hash)" >> release_notes.md
          elif [[ $msg =~ ^docs ]]; then
            echo "- 📚 $msg ($hash)" >> release_notes.md
          elif [[ $msg =~ ^chore ]]; then
            echo "- 🔧 $msg ($hash)" >> release_notes.md
          else
            echo "- $msg ($hash)" >> release_notes.md
          fi
        done || echo "- Initial release" >> release_notes.md

        echo "" >> release_notes.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${NEW_TAG}" >> release_notes.md

    - name: Create GitHub Release
      if: steps.check_version.outputs.version_changed == 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.check_version.outputs.new_version }}
        release_name: Release ${{ steps.check_version.outputs.new_version }}
        body_path: release_notes.md
        draft: false
        prerelease: false