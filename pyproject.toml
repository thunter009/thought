[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thought"]

[project]
name = "thought"
version = "0.3.0"
description = "Notion CLI using Notion's API"
authors = [{ name = "Tom Hunter", email = "tom@hunter.xyz" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "python-dotenv",
    "notion",
    "pandas",
    "recordlinkage",
    "requests-oauthlib",
    "pytoml",
    "requests",
    "notion-client",
    "regex",
    "python-frontmatter",
    "mistune",
]

[project.scripts]
thought = "thought.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "sphinx",
    "ipykernel",
    "commitizen",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ignore E501 line length in test files for long patch statements
"tests/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=thought"
filterwarnings = [
    "ignore:invalid escape sequence:SyntaxWarning:notion.markdown",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.0"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]
update_changelog_on_bump = true
major_version_zero = true
