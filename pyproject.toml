[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thought"]

[project]
name = "thought"
version = "0.1.0"
description = "Notion CLI using Notion's API"
authors = [{ name = "Tom Hunter", email = "tom@hunter.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click",
    "python-dotenv",
    "notion",
    "pandas",
    "recordlinkage",
    "requests-oauthlib",
    "pytoml",
    "requests",
    "notion-client",
    "regex",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "sphinx",
    "ipykernel",
]

[project.scripts]
thought = "thought.cli:cli"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["notion.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["recordlinkage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=thought"
